<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Ev fiyatı ve birikiminizi girin; tapu harcı, emlakçı komisyonu, döner sermaye, kredi taksitleri ve tüm ek masraflarla evin gerçek maliyetini hesaplayın.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Cebinden Eve">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Ev Maliyeti ve Konut Kredisi Hesaplayıcı | Cebinden Eve</title>
  <link rel="canonical" href="https://cebindeneve.com/hesapla/">
  <meta name="robots" content="noindex, follow">
  <link rel="manifest" href="manifest.json">

  <!-- iOS Chrome/Safari: klavye açınca body'nin kaymasını/şişmesini engelle -->
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      position: fixed;
      inset: 0;
      background-color: #efe6d8;
    }
    #splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: #efe6d8; transition: opacity .25s ease;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; color: #1c3d32;
    }
    #splash img { width: 72px; height: 72px; border-radius: 18px; box-shadow: 0 10px 24px rgba(28,61,50,.18); }
    #splash .bar { width: 140px; height: 4px; border-radius: 4px; background: rgba(28,61,50,.12); overflow: hidden; }
    #splash .bar::after { content: ""; display: block; width: 40%; height: 100%; background: #1c3d32; border-radius: 4px; animation: splash 1.1s ease-in-out infinite; }
    #splash p { margin: 0; font-size: 15px; opacity: .75; }
    @keyframes splash { 0% { transform: translateX(-100%); } 100% { transform: translateX(250%); } }
  </style>
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
</head>
<body>
  <div id="splash" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="bar"></div>
    <p>Hesaplayıcı yükleniyor…</p>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (!s) return;
      s.style.opacity = '0';
      setTimeout(function () { s.remove(); }, 300);
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <noscript>
    <h1>Cebinden Eve – Ev maliyeti hesaplayıcı</h1>
    <p>Hesaplayıcıyı kullanmak için JavaScript'i etkinleştirin. Ev alırken ödenen masraflar hakkında bilgi için
    <a href="/rehber">rehberlerimize</a> göz atabilirsiniz.</p>
  </noscript>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
