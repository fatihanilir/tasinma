name: ev_hesap_app
description: "Ev Alım Hesaplayıcı - iOS, Android ve Web için"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.0
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.4
  
  # State Management
  provider: ^6.1.2
  
  # Utils
  intl: ^0.20.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  uuid: ^4.5.1
  
  # Icons
  cupertino_icons: ^1.0.8
  
  # Fonts
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/logo.png
